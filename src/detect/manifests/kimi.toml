id = "kimi"
version = "2026.10.27.1"
min_engine_version = 1
updated_at = "2026-10-27T00:00:00Z"
aliases = ["kimi-code", "kimi code"]

[[rules]]
id = "current_approval_panel"
state = "blocked"
priority = 400
region = "whole_recent"
visible_blocker = true
contains = ["↵ confirm"]
any = [
  { contains = ["run this command?"] },
  { contains = ["write this file?"] },
  { contains = ["apply these edits?"] },
  { contains = ["stop this task?"] },
  { contains = ["ready to build with this plan?"] },
  { line_regex = ['(?i)^\s*▶?\s*approve .*\?$'] },
]
all = [
  { contains = [" choose"] },
  { any = [{ contains = ["approve"] }, { contains = ["reject"] }, { contains = ["revise"] }] },
]

[[rules]]
id = "approval_panel_options"
state = "blocked"
priority = 395
region = "whole_recent"
visible_blocker = true
# Narrow panes truncate the footer controls ("↵ c..."), but the numbered
# option rows keep their leading words. Match the option block so pane width
# does not decide between blocked and idle.
line_regex = [
  '(?i)^\s*▶?\s*\d+\.\s*approve\b',
  '(?i)^\s*▶?\s*\d+\.\s*reject\b',
]

[[rules]]
id = "question_panel"
state = "blocked"
priority = 390
region = "whole_recent"
visible_blocker = true
contains = ["↑↓ select"]
all = [
  { any = [{ line_regex = ['^\s*question\s*$'] }, { line_regex = ['^\s*\? '] }] },
  { line_regex = ['^\s*(?:→\s*)?\[1\]'] },
]

[[rules]]
id = "trust_folder"
state = "blocked"
priority = 350
region = "whole_recent"
visible_blocker = true
contains = ["trust this"]
any = [
  { contains = ["trust and continue"] },
  { line_regex = ['^\s*❯\s*trust\b'] },
]

[[rules]]
id = "legacy_approval_panel"
state = "blocked"
priority = 300
region = "whole_recent"
contains = ["requesting approval", "reject"]
any = [
  { contains = ["approve once"] },
  { contains = ["approve for this session"] },
]
all = [
  { any = [{ contains = ["1/2/3/4 choose"] }, { contains = ["↵ confirm"] }] },
]

[[rules]]
id = "background_agent_status_working"
state = "working"
priority = 120
region = "bottom_non_empty_lines(6)"
visible_working = true
line_regex = ['(?i)\bthinking(?::\s*\w+)?\b.*\[[1-9][0-9]*\s+(?:agents?|tasks?)\s+running\]']

[[rules]]
id = "moon_spinner_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(20)"
visible_working = true
line_regex = ['^\s*(🌕|🌖|🌗|🌘|🌑|🌒|🌓|🌔)(?:\s*·\s*Tip:.*)?\s*$']

[[rules]]
id = "braille_spinner_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(20)"
visible_working = true
any = [
  { line_regex = ['(?i)^\s*[\x{2800}-\x{28FF}]+\s+(?:thinking|working)(?:\.\.\.|…)(?:\s*·\s*Tip:.*)?\s*$'] },
  { line_regex = ['(?i)^\s*[\x{2800}-\x{28FF}]+\s+using\s'] },
]
